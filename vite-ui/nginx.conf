server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # O service worker e o manifest nunca podem ficar em cache
  location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest|workbox-.*\.js)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer rota cai no index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
