services:
    db:
        image: postgres:16
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-clavis}
        ports:
            - "${DB_PORT:-5432}:5432"
        volumes:
            - clavis-db:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    api:
        build: ./api
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        environment:
            NODE_ENV: production
            PORT: 3333
            DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-clavis}
            JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-troque-por-um-segredo-longo-e-aleatorio}
            JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-troque-por-outro-segredo-longo-e-aleatorio}
            JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
            JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
            # Exigida pela validação do env, mas ainda não usada pelo código
            REDIS_URL: redis://localhost:6379
            FRONTEND_URL: http://localhost:${UI_PORT:-5173}
        ports:
            - "${API_PORT:-3333}:3333"
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        networks: [default, traefik-public]
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public
            - traefik.http.routers.clavis-api.rule=Host(`clavis-api.meraki.dev.br`)
            - traefik.http.routers.clavis-api.entrypoints=websecure
            - traefik.http.routers.clavis-api.tls.certresolver=myresolver
            - traefik.http.services.clavis-api.loadbalancer.server.port=3333

    ui:
        build:
            context: ./vite-ui
            args:
                # URL da API como o navegador enxerga (host, não a rede do Docker)
                VITE_API_URL: http://localhost:${API_PORT:-3333}
        restart: unless-stopped
        depends_on:
            - api
        ports:
            - "${UI_PORT:-5173}:80"
        networks: [default, traefik-public]
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public
            - traefik.http.routers.clavis-ui.rule=Host(`clavis.seudominio.com`)
            - traefik.http.routers.clavis-ui.entrypoints=websecure
            - traefik.http.routers.clavis-ui.tls.certresolver=letsencrypt
            - traefik.http.services.clavis-ui.loadbalancer.server.port=80

    # Uso: docker compose --profile seed run --rm seed
    seed:
        profiles: ["seed"]
        build:
            context: ./api
            target: build
        depends_on:
            api:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-clavis}
        command:
            - sh
            - -c
            - npx --yes tsx src/shared/database/seeds/plans.seed.ts && npx --yes tsx src/shared/database/seeds/users.seed.ts

volumes:
    clavis-db:

networks:
    traefik-public:
        external: true
